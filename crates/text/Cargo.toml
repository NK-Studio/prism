[package]
name = "prism-text"
description = "Font database, text shaping/layout (parley) and text-layer rasterization"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
parley = { version = "0.11", default-features = false, features = ["std", "complex-scripts"] }
prism-geom = { workspace = true }
prism-color = { workspace = true }
prism-raster = { workspace = true }
prism-doc = { workspace = true }
prism-psd = { workspace = true }
# No `system` feature: fontique's system backend links fontconfig on Linux. We scan font
# directories ourselves and always register the bundled fonts.
skrifa = "0.44"
flate2 = { workspace = true }
encoding_rs = "0.8"
