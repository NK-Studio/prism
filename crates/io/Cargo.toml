[package]
name = "prism-io"
description = "Import/export between prism documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to prism-codecs; see its `heif` feature).
heif = ["prism-codecs/heif"]

[dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

prism-geom = { workspace = true }
prism-color = { workspace = true }
prism-cms = { workspace = true }
prism-raster = { workspace = true }
prism-doc = { workspace = true }
prism-compose = { workspace = true }
prism-algo = { workspace = true }
prism-psd = { workspace = true }
prism-codecs = { workspace = true }
prism-raw = { workspace = true }
prism-affinity = { workspace = true }
prism-text = { workspace = true }
prism-paint = { workspace = true }
prism-vector = { workspace = true }
prism-format = { path = "../format" }
thiserror = { workspace = true }
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# SVG import (svg.rs): usvg parses, resvg rasterises what the shape model can't hold. Both are
# already in the tree through the UI's icon loader; text shaping needs the fonts feature set.
[dev-dependencies]
crc32fast = "1.5"
prism-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
prism-psd = { workspace = true, features = ["testgen"] }
prism-raw = { workspace = true, features = ["testgen"] }
proptest = { workspace = true }
