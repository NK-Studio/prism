[package]
name = "prism-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Effect distance fields are computed in parallel bands.
rayon = { workspace = true }

half = "2"
prism-geom = { workspace = true }
prism-color = { workspace = true }
prism-raster = { workspace = true }
prism-doc = { workspace = true }
prism-compose = { workspace = true }
# Same major version as eframe's wgpu so the app's device can be shared.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
log = { workspace = true }

[dev-dependencies]
wgpu = { version = "30" }
pollster = "1"
# Shape layers in the effect parity tests.
prism-vector = { workspace = true }
