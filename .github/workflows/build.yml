# Desktop builds on GitHub-hosted runners (free for public repos): Windows x64 and macOS
# Apple Silicon (Intel Macs are not supported), packaged with the same scripts as release.yml.
# The macOS build is signed and notarized with the `macos-signing` environment's secrets; Windows is
# unsigned. Download the installers from the run's Artifacts.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "log/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older build of the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PRISM_BUILD_SHA: ${{ github.sha }}
  # Same pin as release.yml: the embedded fonts (see docs/development.md › Fonts).
  CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    environment: macos-signing
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts (embedded fonts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-macos-aarch64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Signing and notarization secrets come from the `macos-signing` environment (allowed on
      # `main` and `release`; it holds only the Apple secrets), the same ones release.yml uses: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      # KEYCHAIN_PASSWORD, and APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER (or the Apple ID
      # set). Missing ones give an ad-hoc signed, unnotarized build and a warning, not a failure.
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign, notarize (DMG, CLI zip)
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch aarch64
      - name: Verify signatures and notarization
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/verify.sh --arch aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: prism-macos-aarch64
          path: dist/release/*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts (embedded fonts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-windows-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      # No signing secrets: sign.ps1 warns and leaves the files unsigned (SmartScreen may warn).
      - name: Build and package (MSI, portable zip)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: prism-windows-x64
          path: dist/release/*
          if-no-files-found: error
