# What changed in each version, as the Software Update window lists it ("What's new in this
# version"). `cargo xtask update publish` copies the table of the version it publishes into the
# signed feed (`notes` in latest.json); a version without a table publishes without a list and
# the window then shows only the Release Notes link.
#
# One table per version, newest first. One short line per change a user would notice, in each
# language Prism ships (`ko`, `en`): plain text, no Markdown, at most 24 lines of 300 characters.
# Write the table in the same change as the feature, or at the latest before publishing.

