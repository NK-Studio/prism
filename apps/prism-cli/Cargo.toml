[package]
name = "prism-cli"
description = "Headless Prism: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional prism-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["prism-codecs/heif"]

[lints]
workspace = true

[lib]
name = "prism_cli"
path = "src/lib.rs"

[[bin]]
name = "prism-cli"
path = "src/main.rs"

[dependencies]
prism-automation = { path = "../../crates/automation" }
prism-engine = { workspace = true }
prism-io = { workspace = true }
prism-format = { path = "../../crates/format" }
prism-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for prism-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

