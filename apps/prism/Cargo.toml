[package]
name = "prism"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "prism"
description = "Prism: an open-source, native image editor"
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional prism-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["prism-codecs/heif"]

[lints]
workspace = true

[dependencies]
rfd = { workspace = true }
arboard = "3.6"
open = "5"
# Reads the saved window layout (eframe persistence) to drop values that would abort startup.
ron = "0.12"

prism-doc = { workspace = true }
prism-color = { workspace = true }
prism-raster = { workspace = true }
prism-geom = { workspace = true }
prism-compose = { workspace = true }
prism-engine = { workspace = true }
prism-codecs = { workspace = true }
prism-io = { workspace = true }
prism-format = { workspace = true }
prism-automation = { workspace = true }
prism-ui-egui = { workspace = true }
# In-app updates: signed feed, verified download, whole-app replacement.
prism-updater = { workspace = true }
# Pen tablet pressure/tilt on macOS (the workspace's one isolated unsafe helper crate).
prism-tablet = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "freebsd")'.dependencies]
# FreeBSD still uses native X11/Wayland windows.
eframe = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Safe CoreGraphics bindings, compatible with the existing macOS 11 deployment target.
core-graphics2 = { version = "=0.6.1", default-features = false, features = ["display", "window", "link"] }
# Finder double-click / Open With / Dock drops arrive as Apple events; this small audited crate
# registers the handler (Objective-C interop needs unsafe, which our workspace forbids) behind a
# safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"
# Safe AppKit calls only: turn off AppKit's title bar dragging (mac_window.rs) and find where the
# pointer is when files are dropped (cursor.rs; winit 0.30 drops carry no position). Already in
# Cargo.lock (winit, prism-tablet); pinned exactly to the same versions.
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry", "NSProcessInfo", "NSString", "NSURL"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSApplicationScripting", "NSEvent", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSScreen", "NSView", "NSWindow"] }
# The Save window's Other Location… panel (location_panel.rs) takes a completion block. Already in
# Cargo.lock (objc2-app-kit); pinned exactly to the same version.
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
# The macOS menu bar (mac_menu.rs): a standalone native menu crate (from the tauri-apps org, but
# not Tauri: no webview, no JS), AppKit menus behind a safe API (no GTK with default features off). Pinned exactly: review the diff before bumping.
muda = { version = "=0.21.1", default-features = false }
# Quit with `terminate:` from the main queue, outside winit's event handler (mac_window.rs).
# Already in Cargo.lock (winit, objc2-app-kit); pinned exactly to the same version.
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }


# Drop position on Windows (`cursor.rs`): safe Win32 wrappers (GetCursorPos), no dependencies of
# its own. Pinned exactly: review the diff before bumping.
[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "=0.30.13", default-features = false }
# Safe Windows screen-capture bindings.
xcap = "=0.9.8"
winsafe = { version = "=0.0.29", default-features = false, features = ["user"] }

# tests/mac_menu_appkit.rs: reads AppKit's menu bar back and sends it real key events.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSResponder"] }

[[test]]
name = "mac_menu_appkit"
harness = false

[build-dependencies]
# Icon + VERSIONINFO for prism.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
