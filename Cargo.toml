[workspace]
resolver = "3"
exclude = ["vendor/eframe"]
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/prism", "apps/prism-cli", "xtask"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
prism-geom = { path = "crates/geom" }
prism-color = { path = "crates/color" }
prism-cms = { path = "crates/cms" }
prism-raster = { path = "crates/raster" }
prism-doc = { path = "crates/doc" }
prism-ops = { path = "crates/ops" }
prism-psd = { path = "crates/psd" }
prism-codecs = { path = "crates/codecs" }
prism-raw = { path = "crates/raw" }
prism-affinity = { path = "crates/affinity" }
prism-compose = { path = "crates/compose" }
prism-gpu = { path = "crates/gpu" }
prism-paint = { path = "crates/paint" }
prism-algo = { path = "crates/algo" }
prism-io = { path = "crates/io" }
prism-text = { path = "crates/text" }
prism-vector = { path = "crates/vector" }
prism-format = { path = "crates/format" }
prism-automation = { path = "crates/automation" }
prism-plugins = { path = "crates/plugins" }
prism-engine = { path = "crates/engine" }
prism-ui-egui = { path = "crates/ui-egui" }
prism-testkit = { path = "crates/testkit" }
prism-tablet = { path = "crates/tablet" }
prism-updater = { path = "crates/updater" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
proptest = "1"
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_kittest = "0.36"
rfd = "0.17"
log = "0.4"
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized local iteration without release LTO or serial code generation.
# Keep unwind so the app's crash guard remains effective.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
panic = "unwind"

# Immediate native viewports need screenshot, clipboard and custom-cursor output handling.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
